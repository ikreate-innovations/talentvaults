[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Next.js plugin for optimized builds
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Only redirect non-www HTTP to HTTPS.
# The 'www' version is handled by checkdomain's Domain Forwarding.
[[redirects]]
  from = "http://talentvaults.com/*"
  to = "https://talentvaults.com/:splat"
  status = 301
  force = true

# Edge Functions for global caching (Optional - ensure the function exists)
[[edge_functions]]
  path = "/*"
  function = "cache-homepage"